aid: nextpoint
name: NextPoint
description: >-
  NextPoint Therapeutics, Inc. is a clinical-stage immuno-oncology biotechnology company
  headquartered at 238 Main Street, Cambridge, Massachusetts. Founded in 2019-2020 out of
  MPM Capital on discoveries by Gordon Freeman (Dana-Farber Cancer Institute) and XingXing
  Zang (Albert Einstein College of Medicine), it develops first-in-class precision
  therapeutics against the B7-H7/HHLA2 - KIR3DL3 immune checkpoint axis, combining direct
  tumor-cell killing with immunomodulation in a single molecule. Its pipeline spans three
  modalities - NPX887, an anti-B7-H7 monoclonal antibody with TMIGD2 co-stimulation and
  enhanced ADCC currently in Phase 1; NPX372, a 2:1 bispecific B7-H7 x CD3 T cell engager;
  and NPX125, a DAR8 antibody drug conjugate - all guided by a biomarker-driven patient
  selection strategy. Investors include Leaps by Bayer, Sanofi Ventures, MPM BioImpact,
  Catalio Capital, Dana-Farber, Invus, Arkin, Simcere, SixtyDegree and Pagoda Tree; its
  shares trade on private secondary marketplaces. It is a therapeutics developer rather
  than a software company and publishes no API, SDK, developer program or machine-readable
  specification.
